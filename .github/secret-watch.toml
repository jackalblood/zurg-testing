# gitleaks config for jackalblood repos: the stock rules, plus the shapes that actually
# turn up in this estate, plus an allowlist for the placeholders we deliberately commit.
[extend]
useDefault = true

# ── extra rules ──────────────────────────────────────────────────────────────
[[rules]]
id = "tailscale-api-key"
description = "Tailscale API key or auth key"
regex = '''tskey-(api|auth|client)-[A-Za-z0-9-]{10,}'''
tags = ["tailscale"]

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth / setup token"
regex = '''sk-ant-(oat|api)[0-9]{2}-[A-Za-z0-9_-]{20,}'''
tags = ["anthropic"]

[[rules]]
id = "karakeep-api-key"
description = "Karakeep API key"
regex = '''ak2_[a-f0-9]{20}_[a-f0-9]{32}'''
tags = ["karakeep"]

[[rules]]
id = "pushover-token"
description = "Pushover application or user key"
regex = '''(?i)pushover[_-]?(app|api|user|token|key)["'\s:=]+[a-z0-9]{28,32}'''
tags = ["pushover"]

[[rules]]
id = "work-tenant-leak"
description = "Work tenant name in a personal repo"
regex = '''(?i)(voltagepark|lambdalabs)'''
tags = ["work-leak"]

[[rules]]
id = "proxmox-api-token"
description = "Proxmox API token secret"
regex = '''(?i)PROXMOX_TOKEN_SECRET\s*[:=]\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
tags = ["proxmox"]

# ── allowlist ────────────────────────────────────────────────────────────────
# Placeholders are committed on purpose; flagging them trains you to ignore the tool.
[allowlist]
description = "Placeholders, examples and docs"
paths = [
  '''\.example$''',
  '''\.sample$''',
  '''\.template$''',
  '''(^|/)node_modules/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)yarn\.lock$''',
]
regexes = [
  '''(?i)(change[-_]?me|replace[-_]?with|your[-_](key|token|password)|<[^>]+>|xxxx+|placeholder|redacted|example\.com|\bdummy\b|\bsample\b|REPLACE_WITH)''',
  '''(?i)kokoro-local-no-key-needed''',
]
