name: secret-watch

# Warns, never blocks. Actions run AFTER a push lands, so this cannot stop you committing —
# it tells you. The run failing IS the notification: red X on the commit plus GitHub's own
# email. Nothing here rewrites history or reverts anything.
#
# Two layers, because they catch different things:
#   1. gitleaks — token and key SHAPES in file contents.
#   2. a filename + archive pass — what a content scanner misses. A .tar.gz holding a .env
#      and a private key is invisible to gitleaks, and that is exactly how a live password
#      ended up in a repo here.

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan the entire history, not just this push"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" > /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan contents for secret shapes
        id: gitleaks
        continue-on-error: true
        env:
          FULL: ${{ github.event.inputs.full_history }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          ARGS="detect --no-banner --redact --report-format json --report-path /tmp/leaks.json"
          if [ -f .github/secret-watch.toml ]; then
            ARGS="$ARGS --config .github/secret-watch.toml"
          fi
          if [ "$FULL" != "true" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ARGS="$ARGS --log-opts $BEFORE..$SHA"
          fi
          gitleaks $ARGS || true
          if [ -f /tmp/leaks.json ]; then
            COUNT=$(jq 'length' /tmp/leaks.json 2>/dev/null || echo 0)
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Look for files that should never be committed
        id: files
        continue-on-error: true
        run: |
          set -uo pipefail
          : > /tmp/files.txt
          # .example / .sample / .template are committed on purpose and stay allowed.
          git ls-files \
            | grep -viE '\.(example|sample|template|dist)$' \
            | grep -iE '(^|/)\.env$|(^|/)\.env\.(local|prod|production)$|id_rsa$|id_ecdsa$|id_ed25519$|(^|/)[a-z0-9_.-]*_key$|\.pem$|\.p12$|\.pfx$|\.jks$|(^|/)sessions\.json$|(^|/)credentials\.json$|\.kdbx$' \
            | sed 's/^/filename: /' >> /tmp/files.txt || true
          # Archives: a content scanner cannot see inside, so look for ourselves.
          for archive in $(git ls-files | grep -iE '\.(tar\.gz|tgz|tar|zip)$' || true); do
            echo "archive: $archive" >> /tmp/files.txt
            case "$archive" in
              *.tar.gz|*.tgz|*.tar)
                tar -tzf "$archive" 2>/dev/null \
                  | grep -iE '(^|/)\.env|_key$|\.pem$|id_rsa|sessions\.json|credentials' \
                  | head -5 | sed 's/^/    contains: /' >> /tmp/files.txt || true
                ;;
            esac
          done
          COUNT=$(grep -c . /tmp/files.txt 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          LEAKS: ${{ steps.gitleaks.outputs.count }}
          FILES: ${{ steps.files.outputs.count }}
        run: |
          set -uo pipefail
          LEAKS=${LEAKS:-0}
          FILES=${FILES:-0}
          echo "## secret-watch" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LEAKS" = "0" ] && [ "$FILES" = "0" ]; then
            echo "Nothing that looks like a secret in this push." >> "$GITHUB_STEP_SUMMARY"
            echo "clean"
            exit 0
          fi
          echo "**A warning, not a block — the push already landed.** Nothing was reverted." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LEAKS" != "0" ]; then
            echo "### Secret-shaped content ($LEAKS)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[:20][] | "\(.File):\(.StartLine)  \(.RuleID)"' /tmp/leaks.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FILES" != "0" ]; then
            echo "### Files that do not belong in a repo ($FILES)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/files.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If it is real: **rotate the credential first**. A force-push does not un-leak — old commits stay fetchable by SHA until GitHub garbage-collects." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "False positive? Add an allowlist entry to \`.github/secret-watch.toml\`." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::secret-watch: $LEAKS secret-shaped match(es), $FILES suspicious file(s) — see the run summary"
          # Fail so it reaches you. The push is already in; this only raises a flag.
          exit 1
